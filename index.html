<style>
:root{
  /* Bancada de oficina: papel quadriculado claro, tinta azul-petróleo, destaque laranja-ferramenta */
  --paper:#F4F2EC; --card:#FFFFFF; --ink:#18262F; --muted:#5B6870; --line:#DDD9CF;
  --accent:#D9480F; --accent-ink:#FFFFFF; --soft:#FBE7DC;
  --ok:#1E7A46; --ok-bg:#E2F3E8; --warn:#9A5B00; --warn-bg:#FCEFD3; --no:#B42318; --no-bg:#FDE6E3; --unk-bg:#ECEAE4;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11181D; --card:#1A242B; --ink:#ECEFF0; --muted:#9AA7AE; --line:#2C3A43;
    --accent:#FF7A3D; --accent-ink:#1A1A1A; --soft:#3A2418;
    --ok:#5BD08C; --ok-bg:#163526; --warn:#F2B64C; --warn-bg:#3A2C12; --no:#FF8A7A; --no-bg:#3E1C19; --unk-bg:#26313A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11181D; --card:#1A242B; --ink:#ECEFF0; --muted:#9AA7AE; --line:#2C3A43;
  --accent:#FF7A3D; --accent-ink:#1A1A1A; --soft:#3A2418;
  --ok:#5BD08C; --ok-bg:#163526; --warn:#F2B64C; --warn-bg:#3A2C12; --no:#FF8A7A; --no-bg:#3E1C19; --unk-bg:#26313A;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;background-position:-1px -1px}
body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.82;z-index:-1}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 10px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,34px);line-height:1.05;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tile b{display:block;font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);display:block;margin-top:4px;line-height:1.2}
.tile.ok b{color:var(--ok)} .tile.warn b{color:var(--warn)}
.tile:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--ink);font-weight:700;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 8px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip .n{opacity:.75;font-variant-numeric:tabular-nums;margin-left:4px}
label.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.list{display:grid;gap:10px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:6px solid var(--unk-bg)}
.act.ready{border-left-color:var(--ok)} .act.near{border-left-color:var(--warn)} .act.far{border-left-color:var(--line)}
.act.done{opacity:.72}
.act h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0;line-height:1.2;text-wrap:balance}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.pill{flex:none;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.ready{background:var(--ok-bg);color:var(--ok)} .pill.near{background:var(--warn-bg);color:var(--warn)} .pill.far{background:var(--unk-bg);color:var(--muted)}
.meta{font-size:13.5px;color:var(--muted);margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .adult{color:var(--accent);font-weight:700}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.m{font:inherit;font-size:13.5px;line-height:1.25;padding:5px 9px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;color:var(--ink)}
.m.y{background:var(--ok-bg);color:var(--ok)}
.m.n{background:var(--no-bg);color:var(--no);font-weight:700}
.m.u{background:var(--unk-bg);color:var(--ink);border-style:dashed;border-color:var(--muted)}
.m.opt{opacity:.8}
.m i{font-style:normal;font-weight:700;margin-right:3px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.hint{font-size:13px;color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
/* Estoque */
.progress{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.progress .track{height:10px;border-radius:99px;background:var(--unk-bg);overflow:hidden;margin-top:8px;display:flex}
.progress .track span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cat{margin:18px 0 6px;font-family:var(--display);font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.inv{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm > b{font-weight:400;display:block}
.row .nm small{color:var(--muted);font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:13.5px;padding:7px 10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.y{background:var(--ok);color:#fff;font-weight:700}
.seg button.on.n{background:var(--no);color:#fff;font-weight:700}
/* Comprar */
.buy .row .nm small b{color:var(--accent);font-weight:700}
.status{font-size:12.5px;color:var(--muted);text-align:right;margin-top:6px;min-height:1em}
.dlg{position:fixed;inset:auto 12px 12px 12px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.dlg[hidden]{display:none}
textarea{width:100%;min-height:160px;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
@media (max-width:420px){
  .tile b{font-size:22px}
  .seg button{padding:7px 8px;font-size:13px}
}
.how{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.how ol{margin:0 0 10px;padding-left:22px;display:grid;gap:6px}
.how li{padding-left:2px}
.how .links{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
a.btn.yt{background:#C4302B;border-color:#C4302B;color:#fff}
.how .pdf{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

 r17:"robô que não cai da mesa sensor mecânico", r18:"robô quadrúpede palito de picolé motor", r19:"robô hexápode palito de picolé", r20:"robô bípede palito motor caixa de redução",

<script>
(function(){
"use strict";
const LS_KEY = "oficina-inventores-v1";
const DOC_PATH = "oficina/estado";
let state = { h:{}, done:{}, updated:0 };
try{ const s = JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(s && s.h) state = s; }catch(e){}

// ---------- parse activities ----------
const ACTS = A.map(r=>({
  id:r[0], book:r[1], title:r[2], page:r[3], time:r[4], diff:r[5], adult:!!r[6],
  mats:r[7].split(" ").filter(Boolean).map(t=>{
    const opt = t[0]==="?"; const [id,q] = t.replace(/^\?/,"").split(":");
    return {id, q:q||"", opt};
  })
}));
const USE = {}; ACTS.forEach(a=>a.mats.forEach(m=>{ if(!m.opt){ (USE[m.id] ||= []).push(a.id);} }));
const DIFF = {1:"Fácil",2:"Médio",3:"Difícil"};

function has(id){ return state.h[id]; } // 1 tenho, 0 não tenho, undefined não conferido
function missing(a){ return a.mats.filter(m=>!m.opt && has(m.id)!==1); }
function level(a){ const n = missing(a).length; return n===0?"ready":(n<=2?"near":"far"); }

// ---------- UI state ----------
const OPEN = new Set();
const SUF = {rob:" robô caseiro como fazer",exp:" experimento para crianças",rec:" reciclável para crianças",art:" artesanato de papel crianças",kit:" crianças atividade",dia:" crianças como fazer"};
function ytq(a){ return "https://www.youtube.com/results?search_query="+encodeURIComponent(V[a.id] || (a.title.replace(/\(.*?\)/g,"").replace(/^Dia \d+: /,"").trim()+SUF[a.book])); }
const ui = { q:"", book:"all", st:"all", hideDone:false, invQ:"", onlyUnk:false, buyBook:"all" };

// ---------- persistence ----------
let db=null, saveTimer=null, writing=false, pending=false;
function persist(){
  state.updated = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 900);
}
async function pushRemote(){
  if(!db) return;
  if(writing){ pending=true; return; }
  writing=true; setSync("Salvando…");
  try{ await db.doc(DOC_PATH).set({h:state.h, done:state.done, updated:state.updated}); setSync("Salvo na nuvem ✓"); }
  catch(e){ setSync(e && e.code==="invalid_argument" ? "Só leitura: este estoque não pode ser alterado por você." : "Não salvou na nuvem agora; ficou guardado neste aparelho."); }
  writing=false; if(pending){ pending=false; pushRemote(); }
}
function setSync(t){ document.getElementById("sync").textContent = t; }

(async ()=>{
  try{
    if(!window.claude || !window.claude.use){ setSync("Salvando só neste aparelho."); return; }
    db = await window.claude.use("db");
    if(!db){ setSync("Salvando só neste aparelho."); return; }
    const timer = setTimeout(()=>setSync("Ainda conectando à nuvem… suas marcações ficam neste aparelho enquanto isso."), 10000);
    db.doc(DOC_PATH).onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(timer);
      if(snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        const d = snap.data()||{};
        if((d.updated||0) > (state.updated||0)){
          state = { h:Object.assign({},d.h||{}), done:Object.assign({},d.done||{}), updated:d.updated||0 };
          try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
          render();
        }
        setSync("Sincronizado ✓");
      } else if(state.updated){ pushRemote(); }
      else setSync("Pronto para salvar na nuvem.");
    }, err=>{ clearTimeout(timer); setSync("Sem conexão com a nuvem; salvando neste aparelho."); });
  }catch(e){ setSync("Salvando só neste aparelho."); }
})();

// ---------- helpers ----------
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }
function setHave(id,v){ if(v===undefined) delete state.h[id]; else state.h[id]=v; persist(); render(); }

function counts(){
  let r=0,n=0; ACTS.forEach(a=>{ const l=level(a); if(l==="ready")r++; else if(l==="near")n++; });
  const ids=Object.keys(USE); const checked=ids.filter(i=>state.h[i]!==undefined).length;
  return {r,n,checked,total:ids.length};
}
function tiles(){
  const c=counts();
  $("#tiles").innerHTML =
   `<button class="tile ok" data-go="ready"><b>${c.r}</b><span>dá pra fazer agora</span></button>
    <button class="tile warn" data-go="near"><b>${c.n}</b><span>falta 1 ou 2 itens</span></button>
    <button class="tile" data-go="estoque"><b>${c.checked}<small style="font-size:15px;color:var(--muted)">/${c.total}</small></b><span>materiais conferidos</span></button>`;
}

// ---------- views ----------
function viewActs(){
  const q=norm(ui.q);
  let list = ACTS.filter(a=> ui.book==="all" || a.book===ui.book);
  const bookCount = {}; ACTS.forEach(a=>bookCount[a.book]=(bookCount[a.book]||0)+1);
  if(q) list = list.filter(a=> norm(a.title).includes(q) || a.mats.some(m=>norm(M[m.id][0]).includes(q)));
  if(ui.hideDone) list = list.filter(a=>!state.done[a.id]);
  const lv = a=>level(a);
  if(ui.st!=="all") list = list.filter(a=> ui.st==="ready" ? lv(a)==="ready" : lv(a)!=="far" );
  list.sort((x,y)=> (missing(x).length - missing(y).length) || (x.diff-y.diff) || x.id.localeCompare(y.id));

  const bookChips = [["all","Todos",ACTS.length]].concat(Object.keys(BOOKS).map(k=>[k,BOOKS[k].name,bookCount[k]]))
    .map(([k,n,c])=>`<button class="chip" data-book="${k}" aria-pressed="${ui.book===k}">${esc(n)}<span class="n">${c}</span></button>`).join("");
  const st = [["all","Todas"],["ready","Dá pra fazer"],["near","Dá ou quase"]]
    .map(([k,n])=>`<button class="chip" data-st="${k}" aria-pressed="${ui.st===k}">${n}</button>`).join("");

  const cards = list.map(a=>{
    const miss = missing(a), l=level(a), done=state.done[a.id];
    const pill = l==="ready" ? "Dá pra fazer" : (miss.length===1?"Falta 1":"Faltam "+miss.length);
    const mats = a.mats.map(m=>{
      const v=has(m.id), cls = v===1?"y":(v===0?"n":"u"), ic = v===1?"✓":(v===0?"✗":"?");
      const q = m.q ? (/^\d+$/.test(m.q)? m.q+"× " : m.q+" ") : "";
      return `<button class="m ${cls}${m.opt?" opt":""}" data-mat="${m.id}" title="Toque para alternar tenho / não tenho"><i>${ic}</i>${esc(q+M[m.id][0])}${m.opt?" (opcional)":""}</button>`;
    }).join("");
    return `<article class="act ${l}${done?" done":""}">
      <div class="top"><h3>${esc(a.title)}</h3><span class="pill ${l}">${pill}</span></div>
      <div class="meta"><span>${esc(BOOKS[a.book].name)} · pág. ${a.page}</span><span>${esc(a.time)}</span><span>${DIFF[a.diff]}</span>${a.adult?'<span class="adult">com adulto</span>':""}</div>
      <div class="mats">${mats}</div>
      <div class="foot"><button class="btn primary" data-how="${a.id}" aria-expanded="${OPEN.has(a.id)}">${OPEN.has(a.id)?"Fechar":"Como fazer"}</button>
        <button class="btn ${done?"done":""}" data-done="${a.id}">${done?"Feita em "+done.split("-").reverse().slice(0,2).join("/"):"Marcar como feita"}</button></div>
      ${OPEN.has(a.id)?`<div class="how"><ol>${(S[a.id]||"").split("|").filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
        <p class="pdf">Medidas, fotos e detalhes: PDF <b>${esc(BOOKS[a.book].file)}</b>, página ${a.page}.</p>
        <div class="links"><a class="btn yt" href="${ytq(a)}" target="_blank" rel="noopener">▶ Ver vídeos no YouTube</a></div></div>`:""}
    </article>`;
  }).join("");

  return `<div class="bar"><input type="search" id="q" placeholder="Buscar atividade ou material (ex.: balão, motor)" value="${esc(ui.q)}" aria-label="Buscar">
     <button class="btn primary" id="sortear">Sortear uma pronta</button></div>
    <div class="chips" role="group" aria-label="Livro">${bookChips}</div>
    <div class="bar"><div class="chips" role="group" aria-label="Situação" style="margin:0">${st}</div>
      <label class="tog"><input type="checkbox" id="hideDone" ${ui.hideDone?"checked":""}> esconder as já feitas</label></div>
    <p class="hint" style="margin:0 0 10px">${list.length} atividade${list.length===1?"":"s"}. Toque em <b>Como fazer</b> para ver o passo a passo e vídeos. Toque num material para marcar se tem (✓) ou não (✗); tracejado (?) = não conferido.</p>
    <div class="list">${cards || '<div class="empty">Nenhuma atividade com esse filtro.</div>'}</div>`;
}

function viewInv(){
  const ids = Object.keys(USE);
  const y=ids.filter(i=>state.h[i]===1).length, n=ids.filter(i=>state.h[i]===0).length, u=ids.length-y-n;
  const q=norm(ui.invQ);
  let html = `<div class="progress"><b>${y} tenho · ${n} não tenho · ${u} para conferir</b>
     <div class="track"><span style="width:${y/ids.length*100}%;background:var(--ok)"></span><span style="width:${n/ids.length*100}%;background:var(--no)"></span></div>
     <div class="legend"><span><i style="background:var(--ok)"></i>tenho</span><span><i style="background:var(--no)"></i>não tenho</span><span><i style="background:var(--unk-bg)"></i>não conferido</span></div></div>
   <div class="bar"><input type="search" id="invq" placeholder="Buscar material" value="${esc(ui.invQ)}" aria-label="Buscar material">
     <label class="tog"><input type="checkbox" id="onlyUnk" ${ui.onlyUnk?"checked":""}> só os não conferidos</label></div>
   <p class="hint" style="margin:0">Dica: confira primeiro a caixa de eletrônicos que você comprou. Os itens estão em ordem de quantas atividades usam cada um.</p>`;
  Object.keys(CATS).forEach(c=>{
    let items = ids.filter(i=>M[i][1]===c);
    if(q) items = items.filter(i=>norm(M[i][0]).includes(q));
    if(ui.onlyUnk) items = items.filter(i=>state.h[i]===undefined);
    if(!items.length) return;
    items.sort((a,b)=>USE[b].length-USE[a].length || M[a][0].localeCompare(M[b][0]));
    const done = ids.filter(i=>M[i][1]===c && state.h[i]!==undefined).length, tot=ids.filter(i=>M[i][1]===c).length;
    html += `<div class="cat">${CATS[c]}<small>${done}/${tot} conferidos</small></div><div class="inv">` +
      items.map(i=>{ const v=state.h[i];
        return `<div class="row"><div class="nm"><b>${esc(M[i][0])}</b><small>usado em ${USE[i].length} atividade${USE[i].length>1?"s":""}</small></div>
          <div class="seg" role="group" aria-label="${esc(M[i][0])}">
            <button class="y ${v===1?"on":""}" data-set="${i}" data-v="1" aria-pressed="${v===1}">Tenho</button>
            <button class="n ${v===0?"on":""}" data-set="${i}" data-v="0" aria-pressed="${v===0}">Não</button></div></div>`;}).join("") + `</div>`;
  });
  return html;
}

function viewBuy(){
  const pool = ACTS.filter(a=>(ui.buyBook==="all"||a.book===ui.buyBook) && !state.done[a.id]);
  const score = {};
  pool.forEach(a=>{
    const miss = missing(a);
    miss.forEach(m=>{
      const s = score[m.id] ||= {unlock:0, uses:0, near:0, acts:[]};
      s.uses++; s.acts.push(a.title);
      if(miss.length===1) s.unlock++;
      if(miss.length<=3) s.near++;
    });
  });
  // considera só o que ela marcou "não tenho" ou ainda não conferiu
  let items = Object.keys(score).sort((a,b)=> score[b].unlock-score[a].unlock || score[b].near-score[a].near || score[b].uses-score[a].uses);
  const unk = items.filter(i=>state.h[i]===undefined).length;
  const chips = [["all","Todos"]].concat(Object.keys(BOOKS).map(k=>[k,BOOKS[k].name]))
    .map(([k,n])=>`<button class="chip" data-buybook="${k}" aria-pressed="${ui.buyBook===k}">${esc(n)}</button>`).join("");
  const top = items.filter(i=>state.h[i]===0);
  const rows = (arr)=>arr.map(i=>{ const s=score[i];
      const lead = s.unlock ? `<b>libera ${s.unlock} atividade${s.unlock>1?"s":""} sozinho</b> · ` : "";
      return `<div class="row"><div class="nm"><b>${esc(M[i][0])}</b><small>${lead}usado em ${s.uses} que você ainda não fez</small></div>
        <button class="btn" data-set="${i}" data-v="1">Comprei</button></div>`; }).join("");
  const unkList = items.filter(i=>state.h[i]===undefined).slice(0,12);
  return `<div class="chips" role="group" aria-label="Livro">${chips}</div>
    <p class="hint" style="margin:4px 0 10px">Ordenado pelo que destrava mais atividades. "Libera sozinho" = é o único item que falta naquela atividade.</p>
    <div class="cat">Marcados como "não tenho"<small>${top.length} itens</small></div>
    ${top.length? `<div class="inv buy">${rows(top)}</div><div class="foot"><span class="hint">Copia a lista para mandar no WhatsApp ou levar na papelaria.</span><button class="btn primary" id="copy">Copiar lista de compras</button></div><textarea id="copyBox" readonly hidden></textarea>` : '<div class="empty">Nenhum item marcado como "não tenho" ainda. Marque no Estoque ou tocando nos materiais das atividades.</div>'}
    ${unk? `<div class="cat">Ainda não conferidos que mais pesam<small>${unk} no total</small></div><div class="inv buy">${unkList.map(i=>{const s=score[i];return `<div class="row"><div class="nm"><b>${esc(M[i][0])}</b><small>${s.unlock?`<b>libera ${s.unlock} sozinho</b> · `:""}usado em ${s.uses}</small></div>
      <div class="seg"><button class="y" data-set="${i}" data-v="1">Tenho</button><button class="n" data-set="${i}" data-v="0">Não</button></div></div>`}).join("")}</div>`:""}`;
}

// ---------- router ----------
function route(){ const h=(location.hash||"#atividades").slice(1); return ["atividades","estoque","comprar"].includes(h)?h:"atividades"; }
function render(){
  tiles();
  const r=route();
  ["atividades","estoque","comprar"].forEach(k=>{ const t=document.getElementById("t-"+k); if(k===r) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); });
  const active = document.activeElement && document.activeElement.id;
  const pos = active && document.activeElement.selectionStart;
  $("#view").innerHTML = r==="estoque"?viewInv():(r==="comprar"?viewBuy():viewActs());
  if(active==="q"||active==="invq"){ const el=document.getElementById(active); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } }
}
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

// ---------- events ----------
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ ui.q=e.target.value; render(); }
  if(e.target.id==="invq"){ ui.invQ=e.target.value; render(); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="hideDone"){ ui.hideDone=e.target.checked; render(); }
  if(e.target.id==="onlyUnk"){ ui.onlyUnk=e.target.checked; render(); }
});
document.addEventListener("click", async e=>{
  const b = e.target.closest("button,[data-go]"); if(!b) return;
  if(b.dataset.go){ if(b.dataset.go==="estoque"){ location.hash="estoque"; } else { ui.st=b.dataset.go; ui.book="all"; ui.q=""; if(route()!=="atividades") location.hash="atividades"; else render(); } return; }
  if(b.dataset.book){ ui.book=b.dataset.book; render(); return; }
  if(b.dataset.st){ ui.st=b.dataset.st; render(); return; }
  if(b.dataset.buybook){ ui.buyBook=b.dataset.buybook; render(); return; }
  if(b.dataset.mat){ const id=b.dataset.mat, v=has(id); setHave(id, v===1?0:1); toast(M[id][0]+": "+(v===1?"não tenho":"tenho")); return; }
  if(b.dataset.set){ const id=b.dataset.set, v=+b.dataset.v; setHave(id, state.h[id]===v && route()==="estoque" ? undefined : v); return; }
  if(b.dataset.how){ const id=b.dataset.how; OPEN.has(id)?OPEN.delete(id):OPEN.add(id); render(); return; }
  if(b.dataset.done){ const id=b.dataset.done; if(state.done[id]) delete state.done[id]; else { const d=new Date(); state.done[id]=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); } persist(); render(); return; }
  if(b.id==="sortear"){
    const pool = ACTS.filter(a=>level(a)==="ready" && !state.done[a.id] && (ui.book==="all"||a.book===ui.book));
    if(!pool.length){ toast("Nenhuma atividade 100% pronta ainda. Confira o estoque primeiro."); return; }
    const a = pool[Math.floor(Math.random()*pool.length)];
    ui.q=a.title; ui.st="all"; render(); toast("Sorteada: "+a.title+" ("+BOOKS[a.book].name+", pág. "+a.page+")"); return;
  }
  if(b.id==="copy"){
    const ids = Object.keys(state.h).filter(i=>state.h[i]===0 && USE[i]);
    const byCat = {}; ids.forEach(i=>(byCat[M[i][1]] ||= []).push(M[i][0]));
    const txt = "Lista de compras – Oficina dos Inventores\n" + Object.keys(CATS).filter(c=>byCat[c]).map(c=>"\n"+CATS[c]+":\n"+byCat[c].sort().map(n=>"- "+n).join("\n")).join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("Lista copiada."); }
    catch(err){ const ta=$("#copyBox"); ta.hidden=false; ta.value=txt; ta.focus(); ta.select(); toast("Não deu pra copiar direto: a lista apareceu abaixo, é só copiar."); }
  }
});

render();
})();
</script>
</body>
</html>
